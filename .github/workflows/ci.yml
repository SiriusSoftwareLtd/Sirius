name: CI
permissions:
  contents: read
on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, Format and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup RoKit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install RoKit packages
        run: rokit install --no-trust-check

      - name: Check formatting
        run: stylua --check source.lua boost.lua prompt.lua

      # Runs before lint and analyze because it is the one check that catches a file
      # nobody can run. The others all passed on the 201-local source.lua that failed
      # to compile on stricter executors and returned nil from loadstring.
      - name: Compile
        run: lune run compile-check.luau

      - name: Lint
        run: |
          selene generate-roblox-std
          selene source.lua boost.lua prompt.lua

      - name: Analyze
        run: |
          curl -sSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau

          # game:HttpGet is an executor extension to DataModel and isn't in Roblox's published
          # API dump, so the analyzer flags every call site. Those lines are filtered out; any
          # other diagnostic fails the build.
          set +e
          luau-lsp analyze --definitions=globalTypes.d.luau --no-strict-dm-types \
            source.lua boost.lua prompt.lua 2>&1 | tee analyze.log
          set -e

          if grep -vE "^\[(INFO|WARN)\]|Key 'HttpGet' not found in external type 'DataModel'" analyze.log \
             | grep -qE "TypeError|SyntaxError|StrictModeError"; then
            echo "::error::luau-lsp reported diagnostics beyond the known HttpGet exception"
            exit 1
          fi

          echo "Analyze clean (HttpGet exceptions only)"
